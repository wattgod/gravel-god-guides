name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Stage static site
        run: |
          mkdir _site
          rsync -a \
            --exclude .git \
            --exclude .github \
            --exclude _site \
            ./ _site/

      - name: Verify Reliance guide correction
        run: |
          test "$(find _site/athletes -path '*/reliance-deep-woods-*/index.html' | wc -l)" -eq 7
          ! grep -R "Reliance Deep Woods" _site/athletes/reliance-deep-woods-*/index.html
          grep -R -q "Reliance Tennessee Gravel" _site/athletes/reliance-deep-woods-*/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
